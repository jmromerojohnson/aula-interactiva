<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Quiz proyectado · 2° básico</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
a{color:#2C6BD3}a:hover{color:#1C4E9E}
</style>
</helmet>
<div style="width: 1440px; height: 810px; box-sizing: border-box; background: #FFF6E6; color: #14213D; padding: 32px 40px; display: flex; flex-direction: column; gap: 22px; font-family: 'Baloo 2', 'Atkinson Hyperlegible', sans-serif">

<div style="display: flex; align-items: center; gap: 20px">
<a href="Catalogo.dc.html" aria-label="Salir" style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; color: #14213D; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #E8D9BC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; font-weight: 700; color: #8A6A30">MATEMÁTICA · 2° BÁSICO A</span>
<span style="font-size: 26px; font-weight: 800">Sumas con reserva</span>
</div>
<div style="flex: 1; display: flex; gap: 8px; justify-content: center" aria-label="Pregunta 3 de 8">
<span style="width: 40px; height: 12px; border-radius: 6px; background: #2FA36B"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #2FA36B"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #14213D"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #EADCC2"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #EADCC2"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #EADCC2"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #EADCC2"></span>
<span style="width: 40px; height: 12px; border-radius: 6px; background: #EADCC2"></span>
</div>
<button type="button" aria-label="Leer la pregunta en voz alta" style="display: flex; align-items: center; gap: 10px; font: inherit; font-size: 20px; font-weight: 700; background: #FFFFFF; color: #14213D; border: 0; border-radius: 16px; padding: 10px 18px; box-shadow: 0 3px 0 #E8D9BC; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"></path></svg>Escuchar</button>
<div aria-label="Quedan 18 segundos" style="position: relative; width: 64px; height: 64px">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#FFFFFF" stroke="#EADCC2" stroke-width="7"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="#F08A24" stroke-width="7" stroke-linecap="round" stroke-dasharray="170 170" stroke-dashoffset="68" transform="rotate(-90 32 32)"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800">18</span>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex; gap: 24px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border-radius: 28px; box-shadow: 0 6px 0 #EADCC2; padding: 26px 34px; display: flex; align-items: center; gap: 36px; min-height: 0">
<div style="flex: 1; min-width: 0">
<div style="font-size: 64px; font-weight: 800; line-height: 1.05">¿Cuánto es 7 + 5?</div>
<div style="font-size: 22px; color: #6B5A3A; margin-top: 6px">Cuenta las manzanas si te ayuda.</div>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 18px">
<div style="display: grid; grid-template-columns: repeat(4, 26px); gap: 8px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #E2463F"></span></div>
<span style="font-size: 40px; font-weight: 800; color: #8A6A30">+</span>
<div style="display: grid; grid-template-columns: repeat(3, 26px); gap: 8px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #7BB342"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #7BB342"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #7BB342"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #7BB342"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #7BB342"></span></div>
</div>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{opciones}}" as="op" hint-placeholder-count="4">
<button type="button" onClick="{{op.pick}}" style="{{op.style}}">
<span style="width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex: none">
<sc-if value="{{op.triangulo}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l10 18H2z"></path></svg></sc-if>
<sc-if value="{{op.circulo}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg></sc-if>
<sc-if value="{{op.cuadrado}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></sc-if>
<sc-if value="{{op.estrella}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.4 4.7L18.2 22 12 18.3 5.8 22l1.6-7.7L2 9.6 9 9z"></path></svg></sc-if>
</span>
<span style="font-size: 58px; font-weight: 800; flex: 1; text-align: left">{{op.valor}}</span>
<sc-if value="{{op.marca}}" hint-placeholder-val="{{false}}"><span style="font-size: 26px; font-weight: 800; background: #FFFFFF; color: #14213D; border-radius: 999px; padding: 4px 16px">{{op.marcaTexto}}</span></sc-if>
</button>
</sc-for>
</div>
</div>

<aside aria-label="Puntaje por casas" style="width: 270px; flex: none; background: #14213D; color: #FFFFFF; border-radius: 28px; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 20px; font-weight: 800">Puntaje por casas</span>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="background: #1E2F55; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px"><span style="width: 18px; height: 40px; border-radius: 6px; background: #2FA36B"></span><span style="flex: 1; font-size: 20px; font-weight: 700">Cóndor</span><span style="font-size: 30px; font-weight: 800">{{puntos.condor}}</span></div>
<div style="background: #1E2F55; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px"><span style="width: 18px; height: 40px; border-radius: 6px; background: #4A8AF0"></span><span style="flex: 1; font-size: 20px; font-weight: 700">Águilas</span><span style="font-size: 30px; font-weight: 800">36</span></div>
<div style="background: #1E2F55; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px"><span style="width: 18px; height: 40px; border-radius: 6px; background: #FFFFFF"></span><span style="flex: 1; font-size: 20px; font-weight: 700">Pumas</span><span style="font-size: 30px; font-weight: 800">32</span></div>
<div style="background: #1E2F55; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px"><span style="width: 18px; height: 40px; border-radius: 6px; background: #E2463F"></span><span style="flex: 1; font-size: 20px; font-weight: 700">Linces</span><span style="font-size: 30px; font-weight: 800">29</span></div>
</div>
<div style="margin-top: auto; background: #1E2F55; border-radius: 16px; padding: 14px; font-size: 17px; line-height: 1.3; color: #C9D3E8">Responde: <strong style="color: #FFFFFF">Cóndor</strong><br>Turno de la casa que va primero en la fila.</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() {
var picked = this.state ? this.state.picked : undefined;
var self = this;
var defs = [
{ valor: '11', color: '#2FA36B', sombra: '#21794F', forma: 'triangulo' },
{ valor: '12', color: '#3A78E0', sombra: '#2A58A8', forma: 'circulo', ok: true },
{ valor: '13', color: '#E38A1C', sombra: '#A86312', forma: 'cuadrado' },
{ valor: '75', color: '#D9413B', sombra: '#A12E2A', forma: 'estrella' }
];
var answered = picked !== undefined;
var opciones = defs.map(function (d, i) {
var dim = answered && !d.ok && i !== picked;
var ring = answered && d.ok ? '; box-shadow: 0 0 0 6px #FFF6E6, 0 0 0 12px #14213D' : '; box-shadow: 0 6px 0 ' + d.sombra;
return {
valor: d.valor,
triangulo: d.forma === 'triangulo', circulo: d.forma === 'circulo', cuadrado: d.forma === 'cuadrado', estrella: d.forma === 'estrella',
marca: answered && (d.ok || i === picked),
marcaTexto: d.ok ? '¡Muy bien!' : 'Casi',
pick: function () { self.setState({ picked: i }); },
style: 'font: inherit; color: #FFFFFF; background: ' + d.color + '; border: 0; border-radius: 24px; padding: 0 24px; display: flex; align-items: center; gap: 20px; cursor: pointer; opacity: ' + (dim ? '0.35' : '1') + ring
};
});
var condor = answered && defs[picked].ok ? '53' : '43';
return { opciones: opciones, puntos: { condor: condor } };
}
}
</script>
</body>
</html>
